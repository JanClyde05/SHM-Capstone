<text x="900.0" y="32" font-size="34px" font-weight="700">CURRENT FIRMWARE FLOW</text>
<rect class="panel" x="24" y="60" width="866" height="1870" rx="5"/><rect class="bar" x="24" y="60" width="866" height="72" rx="5"/><text class="barText" x="457.0" y="96.0" font-size="32px" font-weight="700" fill="#fff"><tspan x="457.0" y="96.0">SESSION CONTROL AND ACQUISITION</tspan></text><rect class="panel" x="910" y="60" width="866" height="1870" rx="5"/><rect class="bar" x="910" y="60" width="866" height="72" rx="5"/><text class="barText" x="1343.0" y="96.0" font-size="32px" font-weight="700" fill="#fff"><tspan x="1343.0" y="96.0">WINDOW ANALYSIS AND FINALIZATION</tspan></text><rect class="terminal" x="207" y="160" width="500" height="70" rx="35.0"/><text class="label" x="457.0" y="195.0" font-size="31px" font-weight="500" fill="#000"><tspan x="457.0" y="195.0">Session request</tspan></text><rect class="box" x="110" y="255" width="694" height="100" rx="8"/><text class="label" x="457.0" y="305.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="287.9">Precheck sensors, PSRAM/storage, mode, station,</tspan><tspan x="457.0" y="322.1">orientation, and settings frozen for formal mode</tspan></text><polygon class="diamond" points="457,379.0 637.0,445 457,511.0 277.0,445"/><text class="label" x="457" y="445" font-size="29px" font-weight="500" fill="#000"><tspan x="457" y="427.9">Do all start</tspan><tspan x="457" y="462.1">checks pass?</tspan></text><rect class="box" x="32" y="404" width="200" height="82" rx="8"/><text class="label" x="132.0" y="445.0" font-size="27px" font-weight="500" fill="#000"><tspan x="132.0" y="429.1">Reject start;</tspan><tspan x="132.0" y="460.9">report reason</tspan></text><rect class="terminal" x="97" y="514" width="100" height="52" rx="26.0"/><text class="label" x="147.0" y="540.0" font-size="27px" font-weight="500" fill="#000"><tspan x="147.0" y="540.0">End</tspan></text><rect class="box" x="160" y="590" width="594" height="76" rx="8"/><text class="label" x="457.0" y="628.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="628.0">Arm session with a 5-second countdown</tspan></text><rect class="box" x="130" y="705" width="650" height="88" rx="8"/><text class="label" x="455.0" y="749.0" font-size="28px" font-weight="500" fill="#000"><tspan x="455.0" y="732.5">Read sequential X/Y/Z samples</tspan><tspan x="455.0" y="765.5">from the three sensors</tspan></text><rect class="box" x="130" y="815" width="650" height="78" rx="8"/><text class="label" x="455.0" y="854.0" font-size="29px" font-weight="500" fill="#000"><tspan x="455.0" y="854.0">Timestamp and buffer each sensor reading</tspan></text><polygon class="diamond" points="457,910.0 657.0,985 457,1060.0 257.0,985"/><text class="label" x="457" y="985" font-size="25px" font-weight="500" fill="#000"><tspan x="457" y="955.5">Are sensors ready</tspan><tspan x="457" y="985.0">and the buffer</tspan><tspan x="457" y="1014.5">available?</tspan></text><rect class="box" x="32" y="944" width="200" height="82" rx="8"/><text class="label" x="132.0" y="985.0" font-size="27px" font-weight="500" fill="#000"><tspan x="132.0" y="969.1">Stop capture;</tspan><tspan x="132.0" y="1000.9">mark incomplete</tspan></text><rect class="terminal" x="97" y="1055" width="100" height="52" rx="26.0"/><text class="label" x="147.0" y="1081.0" font-size="27px" font-weight="500" fill="#000"><tspan x="147.0" y="1081.0">End</tspan></text><polygon class="diamond" points="457,1086.0 657.0,1164 457,1242.0 257.0,1164"/><text class="label" x="457" y="1164" font-size="23px" font-weight="500" fill="#000"><tspan x="457" y="1136.9">Has the next</tspan><tspan x="457" y="1164.0">60-second boundary</tspan><tspan x="457" y="1191.1">arrived?</tspan></text><rect class="box" x="122" y="1295" width="670" height="82" rx="8"/><text class="label" x="457.0" y="1336.0" font-size="28px" font-weight="500" fill="#000"><tspan x="457.0" y="1336.0">Seal and queue the completed 60-second window</tspan></text><polygon class="diamond" points="457,1390.0 657.0,1468 457,1546.0 257.0,1468"/><text class="label" x="457" y="1468" font-size="24px" font-weight="500" fill="#000"><tspan x="457" y="1439.7">Are all 10 windows</tspan><tspan x="457" y="1468.0">within 600 seconds</tspan><tspan x="457" y="1496.3">complete?</tspan></text><rect class="box" x="140" y="1575" width="634" height="78" rx="8"/><text class="label" x="457.0" y="1614.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="1614.0">Stop capture and wait for queued window jobs</tspan></text><circle class="connector" cx="457" cy="1690" r="27"/><text class="connectorText" x="457" y="1690" font-size="28px" font-weight="700" fill="#000"><tspan x="457" y="1690.0">B</tspan></text><text class="label" x="457" y="1734" font-size="25px" font-weight="400" fill="#000"><tspan x="457" y="1734.0">A: continue the capture cycle</tspan></text><text class="label" x="457" y="1772" font-size="25px" font-weight="400" fill="#000"><tspan x="457" y="1772.0">B: continue to window analysis</tspan></text><circle class="connector" cx="850" cy="748" r="26"/><text class="connectorText" x="850" y="748" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="748.0">A</tspan></text><circle class="connector" cx="850" cy="1164" r="26"/><text class="connectorText" x="850" y="1164" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="1164.0">A</tspan></text><circle class="connector" cx="850" cy="1468" r="26"/><text class="connectorText" x="850" y="1468" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="1468.0">A</tspan></text><circle class="connector" cx="950" cy="190" r="26"/><text class="connectorText" x="950" y="190" font-size="28px" font-weight="700" fill="#000"><tspan x="950" y="190.0">B</tspan></text><rect class="box" x="1010" y="153" width="652" height="74" rx="8"/><text class="label" x="1336.0" y="190.0" font-size="28px" font-weight="500" fill="#000"><tspan x="1336.0" y="190.0">Select the next queued window, sensor, and axis</tspan></text><polygon class="diamond" points="134