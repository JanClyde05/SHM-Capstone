e?</tspan></text><rect class="box" x="1160" y="1055" width="360" height="72" rx="8"/><text class="label" x="1340.0" y="1091.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1340.0" y="1076.8">Count valid peaks for each</tspan><tspan x="1340.0" y="1105.2">channel-axis</tspan></text><polygon class="diamond" points="1340,1140.0 1490.0,1225 1340,1310.0 1190.0,1225"/><text class="label" x="1340" y="1225" font-size="18px" font-weight="500" fill="#000"><tspan x="1340" y="1203.8">At least 10</tspan><tspan x="1340" y="1225.0">valid peaks for</tspan><tspan x="1340" y="1246.2">this channel-axis?</tspan></text><rect class="box" x="930" y="1184" width="190" height="82" rx="8"/><text class="label" x="1025.0" y="1225.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1025.0" y="1210.8">Retain QC;</tspan><tspan x="1025.0" y="1239.2">no median</tspan></text><rect class="box" x="1570" y="1184" width="190" height="82" rx="8"/><text class="label" x="1665.0" y="1225.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1665.0" y="1210.8">Calculate</tspan><tspan x="1665.0" y="1239.2">the median</tspan></text><rect class="box" x="1080" y="1340" width="520" height="76" rx="8"/><text class="label" x="1340.0" y="1378.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1340.0" y="1363.8">Save raw records and windows CSV</tspan><tspan x="1340.0" y="1392.2">plus the session summary</tspan></text><rect class="box" x="1160" y="1435" width="360" height="70" rx="8"/><text class="label" x="1340.0" y="1470.0" font-size="23px" font-weight="500" fill="#000"><tspan x="1340.0" y="1456.4">Await the concurrent</tspan><tspan x="1340.0" y="1483.6">vehicle tally</tspan></text><polygon class="diamond" points="1340,1515.0 1490.0,1600 1340,1685.0 1190.0,1600"/><text class="label" x="1340" y="1600" font-size="22px" font-weight="500" fill="#000"><tspan x="1340" y="1574.0">Are local count</tspan><tspan x="1340" y="1600.0">cutoffs</tspan><tspan x="1340" y="1626.0">frozen?</tspan></t