"label" x="457.0" y="529.0" font-size="26px" font-weight="500" fill="#000"><tspan x="457.0" y="529.0">Verify the approved station and orientation</tspan></text><rect class="box" x="86" y="561" width="742" height="52" rx="6"/><text class="label" x="457.0" y="587.0" font-size="26px" font-weight="500" fill="#000"><tspan x="457.0" y="587.0">Install the board at the fixed station</tspan></text><rect class="box" x="86" y="619" width="742" height="52" rx="6"/><text class="label" x="457.0" y="645.0" font-size="26px" font-weight="500" fill="#000"><tspan x="457.0" y="645.0">Run the stationary precheck</tspan></text><rect class="box" x="145" y="710" width="624" height="72" rx="8"/><text class="label" x="457.0" y="746.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="746.0">Start one fixed 600-second session</tspan></text><circle class="connector" cx="850" cy="745" r="26"/><text class="connectorText" x="850" y="745" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="745.0">A</tspan></text><rect class="box" x="90" y="860" width="350" height="86" rx="8"/><text class="label" x="265.0" y="903.0" font-size="27px" font-weight="500" fill="#000"><tspan x="265.0" y="887.1">Record sequential IMU</tspan><tspan x="265.0" y="918.9">samples</tspan></text><rect class="box" x="474" y="860" width="350" height="86" rx="8"/><text class="label" x="649.0" y="903.0" font-size="27px" font-weight="500" fill="#000"><tspan x="649.0" y="887.1">Tally vehicles</tspan><tspan x="649.0" y="918.9">concurrently</tspan></text><rect class="box" x="145" y="990" width="624" height="76" rx="8"/><text class="label" x="457.0" y="1028.0" font-size="28px" font-weight="500" fill="#000"><tspan x="457.0" y="1028.0">Stop both activities at 600 seconds</tspan></text><rect class="box" x="145" y="1090" width="624" height="76" rx="8"/><text class="label" x="457.0" y="1128.0" font-size="28px" font-weight="500" fill="#000"><tspan x="457.0" y="1128.0">Save raw records and session metadata</tspan></text><circle class="connector" cx="457" cy="1230" r="27"/><text class="connectorText" x="457" y="1230" font-size="28px" font-weight="700" fill="#000"><tspan x="457" y="1230.0">B</tspan></text><text class="label" x="457" y="1300" font-size="26px" font-weight="400" fill="#000"><tspan x="457" y="1300.0">A: repeat the fixed session</tspan></text><text class="label" x="457" y="1344" font-size="26px" font-weight="400" fill="#000"><tspan x="457" y="1344.0">B: continue to session checks</tspan></text><circle class="connector" cx="950" cy="190" r="26"/><text class="connectorText" x="950" y="190" font-size="28px" font-weight="700" fill="#000"><tspan x="950" y="190.0">B</tspan></text><rect class="box" x="1010" y="154" width="650" height="72" rx="8"/><text class="label" x="1335.0" y="190.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1335.0" y="175.2">Check predeclared timing, coverage,</tspan><tspan x="1335.0" y="204.8">sensor, and signal criteria</tspan></text><polygon class="diamond" points="1340,245.0 1540.0,320 1340,395.0 1140.0,320"/><text class="label" x="1340" y="320" font-size="23px" font-weight="500" fill="#000"><tspan x="1340" y="306.4">Does the session meet</tspan><tspan x="1340" y="333.6">technical criteria?</tspan></text><rect class="box" x="920" y="279" width="190" height="82" rx="8"/><text class="label" x="1015.0" y="320.0" font-size="23px" font-weight="500" fill="#000"><tspan x="1015.0" y="306.4">Log exclusion</tspan><tspan x="1015.0" y="333.6">reason</tspan></text><rect class="box" x="920" y="390" width="190" height="82" rx="8"/><text class="label" x="1015.0" y="431.0" font-size="22px" font-weight="500" fill="#000"><tspan x="1015.0" y="405.0">Exclude from</tspan><tspan x="1015.0" y="431.0">valid-session</tspan><tspan x="1015.0" y="457.0">set</tspan></text><circle class="connector" cx="950" cy="520" r="26"/><text class="connectorText" x="950" y="520" font-size="28px" font-weight="700" fill="#000"><tspan x="950" y="520.0">A</tspan></text><rect clas