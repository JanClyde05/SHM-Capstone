<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2100" viewBox="0 0 1800 2100">
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="15" markerHeight="15" orient="auto">
    <path d="M 1 1 L 11 6 L 1 11 z" fill="#000"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
    .panel { fill: #fff; stroke: #000; stroke-width: 3; }
    .bar { fill: #000; stroke: #000; stroke-width: 2; }
    .barText { fill: #fff; font-size: 30px; font-weight: 700; letter-spacing: .5px; }
    .box, .diamond, .term { fill: #fff; stroke: #000; stroke-width: 3; }
    .label { font-size: 25px; text-anchor: middle; dominant-baseline: middle; }
    .labelSmall { font-size: 22px; text-anchor: middle; dominant-baseline: middle; }
    .branch { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .arrow { fill: none; stroke: #000; stroke-width: 3.5; stroke-linecap: square; stroke-linejoin: round; marker-end: url(#arrow); }
    .connector { fill: #fff; stroke: #000; stroke-width: 3; }
    .connectorText { font-size: 25px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .note { font-size: 21px; text-anchor: middle; dominant-baseline: middle; }
  </style>
</defs>
<rect width="1800" height="2100" fill="#fff"/>
<text x="900" y="48" text-anchor="middle" font-size="34px" font-weight="700">CURRENT FIRMWARE FLOW</text>
<rect class="panel" x="35" y="90" width="850" height="1970" rx="10"/><rect class="bar" x="35" y="90" width="850" height="68" rx="8"/><text class="barText" x="460" y="124" text-anchor="middle" dominant-baseline="middle">SESSION CONTROL &amp; ACQUISITION</text><rect class="panel" x="915" y="90" width="850" height="1970" rx="10"/><rect class="bar" x="915" y="90" width="850" height="68" rx="8"/><text class="barText" x="1340" y="124" text-anchor="middle" dominant-baseline="middle">WINDOW ANALYSIS &amp; FINALIZATION</text><path class="arrow" d="M 460 260 V 285"/><path class="arrow" d="M 460 375 V 402"/><path class="arrow" d="M 320 450 H 275"/><path class="arrow" d="M 460 515 V 585"/><path class="arrow" d="M 460 670 V 695"/><path class="arrow" d="M 460 795 V 820"/><path class="arrow" d="M 320 890 H 280"/><path class="arrow" d="M 460 960 V 1015"/><path class="arrow" d="M 600 1085 H 824"/><path class="arrow" d="M 460 1155 V 1190"/><path class="arrow" d="M 460 1285 V 1315"/><path class="arrow" d="M 600 1385 H 824"/><path class="arrow" d="M 460 1455 V 1505"/><path class="arrow" d="M 826 745 H 782"/><path class="arrow" d="M 165 940 V 1015 H 93 V 1050"/><path class="arrow" d="M 460 1595 V 1626"/><path class="arrow" d="M 985 250 H 1035"/><path class="arrow" d="M 1695 250 H 1660"/><path class="arrow" d="M 1340 290 V 330"/><path class="arrow" d="M 1200 400 H 1145"/><path class="arrow" d="M 1340 470 V 510"/><path class="arrow" d="M 1340 580 V 605"/><path class="arrow" d="M 1340 675 V 700"/><path class="arrow" d="M 1340 770 V 795"/><path class="arrow" d="M 1340 865 V 900"/><path class="arrow" d="M 1340 975 V 1015"/><path class="arrow" d="M 1035 455 V 937 H 1080"/><path class="arrow" d="M 1480 1085 H 1696"/><path class="arrow" d="M 1340 1155 V 1190"/><path class="arrow" d="M 1340 1265 V 1295"/><path class="arrow" d="M 1200 1365 H 1105"/><path class="arrow" d="M 1480 1365 H 1560"/><path class="arrow" d="M 1015 1410 V 1460 H 1215 V 1490"/><path class="arrow" d="M 1650 1410 V 1460 H 1465 V 1490"/><path class="arrow" d="M 1340 1565 V 1590"/><path class="arrow" d="M 1340 1665 V 1690"/><path class="arrow" d="M 1200 1755 H 1105"/><path class="arrow" d="M 1480 1755 H 1560"/><path class="arrow" d="M 1015 1800 V 1845 H 1215 V 1875"/><path class="arrow" d="M 1650 1800 V 1845 H 1465 V 1875"/><path class="arrow" d="M 1340 1950 V 1975"/><rect class="term" x="270" y="190" width="380" height="70" rx="35.0"/><text class="label" x="460.0" y="225.0"><tspan x="460.0" dy="0">Session request</tspan></text><rect class="box" x="115" y="285" width="690" height="90" rx="4"/><text class="labelSmall" x="460.0" y="315.5"><tspan x="460.0" dy="0">Check precheck, sensors, PSRAM/storage, mode, station,</tspan><tspan x="460.0" dy="29">orientation, and frozen formal settings</tspan></text><polygon class="diamond" points="460,385.0 600.0,450 460,515.0 320.0,450"/><text class="labelSmall" x="460" y="435.5"><tspan x="460" dy="0">All start checks</tspan><tspan x="460" dy="29">pass?</tspan></text><rect class="box" x="50" y="420" width="225" height="100" rx="4"/><text class="labelSmall" x="162.5" y="456.0"><tspan x="162.5" dy="0">Reject start;</tspan><tspan x="162.5" dy="28">report reason</tspan></text><rect class="box" x="195" y="585" width="530" height="85" rx="4"/><text class="labelSmall" x="460.0" y="627.5"><tspan x="460.0" dy="0">Arm session with a 5-second countdown</tspan></text><rect class="box" x="140" y="695" width="640" height="100" rx="4"/><text class="labelSmall" x="460.0" y="730.5"><tspan x="460.0" dy="0">Capture the fixed 600-second session:</tspan><tspan x="460.0" dy="29">read and timestamp sequential channel X/Y/Z samples</tspan></text><polygon class="diamond" points="460,820.0 600.0,890 460,960.0 320.0,890"/><text class="labelSmall" x="460" y="875.5"><tspan x="460" dy="0">Sensors ready and</tspan><tspan x="460" dy="29">buffer capacity available?</tspan></text><rect class="box" x="50" y="840" width="230" height="100" rx="4"/><text class="labelSmall" x="165.0" y="876.0"><tspan x="165.0" dy="0">Stop capture;</tspan><tspan x="165.0" dy="28">mark record incomplete</tspan></text><polygon class="diamond" points="460,1015.0 600.0,1085 460,1155.0 320.0,1085"/><text class="labelSmall" x="460" y="1070.5"><tspan x="460" dy="0">Has the next</tspan><tspan x="460" dy="29">60-second boundary passed?</tspan></text><rect class="box" x="95" y="1190" width="730" height="95" rx="4"/><text class="labelSmall" x="460.0" y="1223.0"><tspan x="460.0" dy="0">Seal and queue the completed window after</tspan><tspan x="460.0" dy="29">all three sensors reach its boundary</tspan></text><polygon class="diamond" points="460,1315.0 600.0,1385 460,1455.0 320.0,1385"/><text class="labelSmall" x="460" y="1370.5"><tspan x="460" dy="0">Are 10 windows</tspan><tspan x="460" dy="29">(600 seconds) complete?</tspan></text><rect class="box" x="175" y="1505" width="570" height="90" rx="4"/><text class="labelSmall" x="460.0" y="1550.0"><tspan x="460.0" dy="0">Stop capture and wait for queued window jobs</tspan></text><circle class="connector" cx="850" cy="745" r="24"/><text class="connectorText" x="850" y="745">A</text><circle class="connector" cx="850" cy="1085" r="24"/><text class="connectorText" x="850" y="1085">A</text><circle class="connector" cx="850" cy="1385" r="24"/><text class="connectorText" x="850" y="1385">A</text><circle class="connector" cx="93" cy="1074" r="24"/><text class="connectorText" x="93" y="1074">B</text><circle class="connector" cx="460" cy="1650" r="24"/><text class="connectorText" x="460" y="1650">B</text><text class="note" x="460" y="1700.0"><tspan x="460" dy="0">A: continue the capture cycle</tspan><tspan x="460" dy="30">B: proceed to queued-window analysis</tspan></text><circle class="connector" cx="960" cy="250" r="24"/><text class="connectorText" x="960" y="250">B</text><circle class="connector" cx="1720" cy="250" r="24"/><text class="connectorText" x="1720" y="250">C</text><circle class="connector" cx="1720" cy="1070" r="24"/><text class="connectorText" x="1720" y="1070">C</text><rect class="box" x="1035" y="210" width="625" height="80" rx="4"/><text class="labelSmall" x="1347.5" y="250.0"><tspan x="1347.5" dy="0">Select the next queued window, sensor, and axis</tspan></text><polygon class="diamond" points="1340,330.0 1480.0,400 1340,470.0 1200.0,400"/><text class="labelSmall" x="1340" y="385.5"><tspan x="1340" dy="0">Do timing, coverage,</tspan><tspan x="1340" dy="29">and signal-quality checks pass?</tspan></text><rect class="box" x="925" y="350" width="220" height="105" rx="4"/><text class="labelSmall" x="1035.0" y="390.0"><tspan x="1035.0" dy="0">Skip spectral steps;</tspan><tspan x="1035.0" dy="25">mark peak invalid</tspan></text><rect class="box" x="1080" y="510" width="520" height="70" rx="4"/><text class="labelSmall" x="1340.0" y="545.0"><tspan x="1340.0" dy="0">Remove the window mean</tspan></text><rect class="box" x="1080" y="605" width="520" height="70" rx="4"/><text class="labelSmall" x="1340.0" y="640.0"><tspan x="1340.0" dy="0">Apply the symmetric Hann window</tspan></text><rect class="box" x="1080" y="700" width="520" height="70" rx="4"/><text class="labelSmall" x="1340.0" y="735.0"><tspan x="1340.0" dy="0">Compute the N-point DFT using Bluestein</tspan></text><rect class="box" x="1080" y="795" width="520" height="70" rx="4"/><text class="labelSmall" x="1340.0" y="830.0"><tspan x="1340.0" dy="0">Select the largest positive in-band bin</tspan></text><rect class="box" x="1080" y="900" width="520" height="75" rx="4"/><text class="labelSmall" x="1340.0" y="937.5"><tspan x="1340.0" dy="0">Store window result and QC flags</tspan></text><polygon class="diamond" points="1340,1015.0 1480.0,1085 1340,1155.0 1200.0,1085"/><text class="labelSmall" x="1340" y="1070.5"><tspan x="1340" dy="0">More queued</tspan><tspan x="1340" dy="29">records?</tspan></text><rect class="box" x="1080" y="1190" width="520" height="75" rx="4"/><text class="labelSmall" x="1340.0" y="1227.5"><tspan x="1340.0" dy="0">Count valid peaks for each channel-axis</tspan></text><polygon class="diamond" points="1340,1295.0 1480.0,1365 1340,1435.0 1200.0,1365"/><text class="labelSmall" x="1340" y="1350.5"><tspan x="1340" dy="0">At least 10 valid peaks</tspan><tspan x="1340" dy="29">for this channel-axis?</tspan></text><rect class="box" x="925" y="1320" width="180" height="90" rx="4"/><text class="labelSmall" x="1015.0" y="1352.5"><tspan x="1015.0" dy="0">Retain QC;</tspan><tspan x="1015.0" dy="25">no median</tspan></text><rect class="box" x="1560" y="1320" width="180" height="90" rx="4"/><text class="labelSmall" x="1650.0" y="1352.5"><tspan x="1650.0" dy="0">Calculate</tspan><tspan x="1650.0" dy="25">per-axis median</tspan></text><rect class="box" x="1040" y="1490" width="600" height="75" rx="4"/><text class="labelSmall" x="1340.0" y="1527.5"><tspan x="1340.0" dy="0">Save raw records, windows CSV, and session summary</tspan></text><rect class="box" x="1040" y="1590" width="600" height="75" rx="4"/><text class="labelSmall" x="1340.0" y="1627.5"><tspan x="1340.0" dy="0">Await the operator’s concurrent vehicle tally</tspan></text><polygon class="diamond" points="1340,1690.0 1480.0,1755 1340,1820.0 1200.0,1755"/><text class="labelSmall" x="1340" y="1740.5"><tspan x="1340" dy="0">Are local count cutoffs</tspan><tspan x="1340" dy="29">frozen?</tspan></text><rect class="box" x="925" y="1710" width="180" height="90" rx="4"/><text class="labelSmall" x="1015.0" y="1742.0"><tspan x="1015.0" dy="0">Assign</tspan><tspan x="1015.0" dy="26">UNCLASSIFIED</tspan></text><rect class="box" x="1560" y="1710" width="180" height="90" rx="4"/><text class="labelSmall" x="1650.0" y="1742.0"><tspan x="1650.0" dy="0">Assign frozen</tspan><tspan x="1650.0" dy="26">local group</tspan></text><rect class="box" x="1040" y="1875" width="600" height="75" rx="4"/><text class="labelSmall" x="1340.0" y="1912.5"><tspan x="1340.0" dy="0">Save the finalized session summary</tspan></text><rect class="term" x="1240" y="1975" width="200" height="50" rx="25.0"/><text class="label" x="1340.0" y="2000.0"><tspan x="1340.0" dy="0">End</tspan></text><text class="branch" x="298" y="430">NO</text><text class="branch" x="500" y="555">YES</text><text class="branch" x="298" y="875">NO</text><text class="branch" x="500" y="978">YES</text><text class="branch" x="710" y="1062">NO</text><text class="branch" x="500" y="1176">YES</text><text class="branch" x="710" y="1362">NO</text><text class="branch" x="500" y="1477">YES</text><text class="branch" x="1172" y="372">NO</text><text class="branch" x="1395" y="492">YES</text><text class="branch" x="1585" y="1062">YES</text><text class="branch" x="1395" y="1172">NO</text><text class="branch" x="1150" y="1340">NO</text><text class="branch" x="1520" y="1340">YES</text><text class="branch" x="1150" y="1730">NO</text><text class="branch" x="1520" y="1730">YES</text></svg>