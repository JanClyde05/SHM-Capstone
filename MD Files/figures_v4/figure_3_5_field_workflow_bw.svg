310" width="700" height="42" rx="4"/><text class="label" x="460.0" y="331.0" style="font-size:20px"><tspan x="460.0" dy="0">Freeze analysis settings</tspan></text><rect class="box" x="110" y="360" width="700" height="42" rx="4"/><text class="label" x="460.0" y="381.0" style="font-size:20px"><tspan x="460.0" dy="0">Freeze pilot traffic-count cutoffs</tspan></text><rect class="box" x="110" y="410" width="700" height="42" rx="4"/><text class="label" x="460.0" y="431.0" style="font-size:20px"><tspan x="460.0" dy="0">Bench-check the single PCB</tspan></text><rect class="box" x="110" y="460" width="700" height="42" rx="4"/><text class="label" x="460.0" y="481.0" style="font-size:20px"><tspan x="460.0" dy="0">Verify approved station and orientation</tspan></text><rect class="box" x="110" y="510" width="700" height="42" rx="4"/><text class="label" x="460.0" y="531.0" style="font-size:20px"><tspan x="460.0" dy="0">Install the board at the fixed station</tspan></text><rect class="box" x="110" y="560" width="700" height="42" rx="4"/><text class="label" x="460.0" y="581.0" style="font-size:20px"><tspan x="460.0" dy="0">Run the stationary precheck</tspan></text><rect class="box" x="150" y="632" width="620" height="62" rx="5"/><text class="label" x="460.0" y="663.0" style="font-size:22px"><tspan x="460.0" dy="0">Start the fixed 600-second session</tspan></text><circle class="connector" cx="840" cy="663" r="22"/><text class="connectorText" x="840" y="663">A</text><rect class="box" x="110" y="754" width="320" height="62" rx="5"/><text class="label" x="270.0" y="771.5" style="font-size:20px"><tspan x="270.0" dy="0">Record sequential IMU</tspan><tspan x="270.0" dy="27">samples</tspan></text><rect class="box" x="490" y="754" width="320" height="62" rx="5"/><text class="label" x="650.0" y="771.5" style="font-size:20px"><tspan x="650.0" dy="0">Tally vehicles</tspan><tspan x="650.0" dy="27">concurrently</tspan></text><rect class="box" x="150" y="860" width="620" height="60" rx="5"/><text class="label" x="460.0" y="890.0" style="font-size:22px"><tspan x="460.0" dy="0">Stop both activities at 600 seconds</tspan></text><rect class="box" x="150" y="960" width="620" height="60" rx="5"/><text class="label" x="460.0" y="990.0" style="font-size:22px"><tspan x="460.0" dy="0">Save raw records and session metadata</tspan></text><circle class="connector" cx="460" cy="1080" r="22"/><text class="connectorText" x="460" y="1080">B</text><text class="note" x="460" y="1142">A: repeat the fixed session</text><text class="note" x="460" y="1180">B: continue to session checks</text><circle class="connector" cx="1340" cy="168" r="22"/><text class="connectorText" x="1340" y="168">B</text><polygon class="diamond" points="1340,215.0 1490.0,270 1340,325.0 1190.0,270"/><text class="label" x="1340" y="257.5" style="font-size:20px"><tspan x="1340" dy="0">Meets technical</tspan><tspan x="1340" dy="25">acceptance criteria?</tspan></text><rect class="box" x="935" y="240" width="190" height="60" rx="5"/><text class="label" x="1030.0" y="270.0" style="font-size:19px"><tspan x="1030.0" dy="0">Log exclusion reason</tspan></text><rect class="box" x="935" y="340" width="190" height="60" rx="5"/><text class="label" x="1030.0" y="356.5" style="font-size:19px"><tspan x="1030.0" dy="0">Exclude from valid-</tspan><tspan x="1030.0" dy="27">session set</tspan></text><circle class="connector" cx="960" cy="425" r="22"/><text class="connectorText" x="960" y="425">A</text><rect class="box" x="1160" y="350" width="360" height="60" rx="5"/><text class="label" x="1340.0" y="380.0" style="font-size:19px"><tspan x="1340.0" dy="0">Calculate rate: r = C/10 vehicles/min</tspan></text><polygon class="diamond" points="1340,425.0 1490.0,480 1340,535.0 1190.0,480"/><text class="label" x="1340" y="467.5" style="font-size:20px"><tspan x="1340" dy="0">Are count cutoffs</tspan><tspan x="1340" dy="25">frozen?</tspan></text><rect class="box" x="935" y="450" width="190" height="60" rx="5"/><text class="label" x="1030.0" y="466.5" style="font-size:19px"><tspan x="1030.0" dy="0">Assign</tspan><tspan x="1030.0" dy="27">UNCLASSIFIED</tspan></text><rect class="box" x="1555" y="450" width="190" height="60" rx="5"/><text class="label" x="1650.0" y="466.5" style="font-size:19px"><tspan x="1650.0" dy="0">Assign pilot-defined</tspan><tspan x="1650.0" dy="27">local group</tspan></text><rect class="box" x="1160" y="570" width="360" height="60" rx="5"/><text class="label" x="1340.0" y="586.5" style="font-size:19px"><tspan x="1340.0" dy="0">Create ten consecutive</tspan><tspan x="1340.0" dy="27">60-second windows</tspan></text><rect class="box" x="1160" y="655" width="360" height="70" rx="5"/><text class="label" x="1340.0" y="676.5" style="font-size:19px"><tspan x="1340.0" dy="0">Process channel-axis windows using</tspan><tspan x="1340.0" dy="27">the firmware flowchart (Figure 3.4)</tspan></text><rect class="box" x="1160" y="750" width="360" height="60" rx="5"/><text class="label" x="1340.0" y="766.5" style="font-size:19px"><tspan x="1340.0" dy="0">Summarize valid estimates by</tspan><tspan x="1340.0" dy="27">channel and axis</tspan></text><rect class="box" x="1160" y="835" width="360" height="60" rx="5"/><text class="label" x="1340.0" y="851.5" style="font-size:19px"><tspan x="1340.0" dy="0">Compare with the matching</tspan><tspan x="1340.0" dy="27">descriptive baseline</tspan></text><rect class="box" x="1160" y="920" width="360" height="60" rx="5"/><text class="label" x="1340.0" y="936.5" style="font-size:19px"><tspan x="1340.0" dy="0">Serve the session summary on</tspan><tspan x="1340.0" dy="27">the local dashboard</tspan></text><polygon class="diamond" points="1340,1010.0 1490.0,1065 1340,1120.0 1190.0,1065"/><text class="label" x="1340" y="1052.5" style="font-size:19px"><tspan x="1340" dy="0">Five valid sessions</tspan><tspan x="1340" dy="25">in every group?</tspan></text><circle class="connector" cx="960" cy="1065" r="22"/><text class="connectorText" x="960" y="1065">A</text><rect class="box" x="1160" y="1170" width="360" height="60" rx="5"/><text class="label" x="1340.0" y="1200.0" style="font-size:20px"><tspan x="1340.0" dy="0">Report actual valid-session counts</tspan></text><text class="branch" x="1155" y="252">NO</text><text class="branch" x="1380" y="336">YES</text><text class="branch" x="1155" y="462">NO</text><text class="branch" x="1525" y="462">YES</text><text class="branch" x="1100" y="1042">NO</text><text class="branch" x="1380" y="1145">YES</text><rect class="box" x="35" y="1340" width="1730" height="105" rx="5"/><text class="note" x="900" y="1378"><tspan x="900">Five sessions per group is a practical target, not a power calculation.</tspan><tspan x="900" dy="34">Align manuscript and firmware window-validity rules before formal collection.</tspan></text></svg>