<text x="900.0" y="32" font-size="34px" font-weight="700">CURRENT FIRMWARE FLOW</text>
<rect class="panel" x="24" y="60" width="866" height="1740" rx="5"/><rect class="bar" x="24" y="60" width="866" height="72" rx="5"/><text class="barText" x="457.0" y="96.0" font-size="32px" font-weight="700" fill="#fff"><tspan x="457.0" y="96.0">SESSION CONTROL AND ACQUISITION</tspan></text><rect class="panel" x="910" y="60" width="866" height="1740" rx="5"/><rect class="bar" x="910" y="60" width="866" height="72" rx="5"/><text class="barText" x="1343.0" y="96.0" font-size="32px" font-weight="700" fill="#fff"><tspan x="1343.0" y="96.0">WINDOW ANALYSIS AND FINALIZATION</tspan></text><rect class="terminal" x="207" y="160" width="500" height="70" rx="35.0"/><text class="label" x="457.0" y="195.0" font-size="31px" font-weight="500" fill="#000"><tspan x="457.0" y="195.0">Session request</tspan></text><rect class="box" x="110" y="255" width="694" height="100" rx="8"/><text class="label" x="457.0" y="305.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="287.9">Precheck sensors, PSRAM/storage, mode, station,</tspan><tspan x="457.0" y="322.1">orientation, and settings frozen for formal mode</tspan></text><polygon class="diamond" points="457,379.0 637.0,445 457,511.0 277.0,445"/><text class="label" x="457" y="445" font-size="29px" font-weight="500" fill="#000"><tspan x="457" y="427.9">Do all start</tspan><tspan x="457" y="462.1">checks pass?</tspan></text><rect class="box" x="52" y="404" width="190" height="82" rx="8"/><text class="label" x="147.0" y="445.0" font-size="27px" font-weight="500" fill="#000"><tspan x="147.0" y="429.1">Reject start;</tspan><tspan x="147.0" y="460.9">report reason</tspan></text><rect class="terminal" x="97" y="514" width="100" height="52" rx="26.0"/><text class="label" x="147.0" y="540.0" font-size="27px" font-weight="500" fill="#000"><tspan x="147.0" y="540.0">End</tspan></text><rect class="box" x="160" y="590" width="594" height="76" rx="8"/><text class="label" x="457.0" y="628.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="628.0">Arm session with a 5-second countdown</tspan></text><rect class="box" x="130" y="705" width="650" height="88" rx="8"/><text class="label" x="455.0" y="749.0" font-size="28px" font-weight="500" fill="#000"><tspan x="455.0" y="732.5">Read sequential X/Y/Z samples</tspan><tspan x="455.0" y="765.5">from the three sensors</tspan></text><rect class="box" x="130" y="815" width="650" height="78" rx="8"/><text class="label" x="455.0" y="854.0" font-size="29px" font-weight="500" fill="#000"><tspan x="455.0" y="854.0">Timestamp and buffer each sensor reading</tspan></text><polygon class="diamond" points="457,920.0 637.0,985 457,1050.0 277.0,985"/><text class="label" x="457" y="985" font-size="28px" font-weight="500" fill="#000"><tspan x="457" y="968.5">Are sensors ready</tspan><tspan x="457" y="1001.5">and buffer available?</tspan></text><rect class="box" x="52" y="944" width="190" height="82" rx="8"/><text class="label" x="147.0" y="985.0" font-size="27px" font-weight="500" fill="#000"><tspan x="147.0" y="969.1">Stop capture;</tspan><tspan x="147.0" y="1000.9">mark incomplete</tspan></text><rect class="terminal" x="97" y="1055" width="100" height="52" rx="26.0"/><text class="label" x="147.0" y="1081.0" font-size="27px" font-weight="500" fill="#000"><tspan x="147.0" y="1081.0">End</tspan></text><polygon class="diamond" points="457,1092.0 637.0,1158 457,1224.0 277.0,1158"/><text class="label" x="457" y="1158" font-size="26px" font-weight="500" fill="#000"><tspan x="457" y="1142.7">Has the next 60-second</tspan><tspan x="457" y="1173.3">window boundary arrived?</tspan></text><rect class="box" x="122" y="1265" width="670" height="82" rx="8"/><text class="label" x="457.0" y="1306.0" font-size="28px" font-weight="500" fill="#000"><tspan x="457.0" y="1306.0">Seal and queue the completed 60-second window</tspan></text><polygon class="diamond" points="457,1372.0 637.0,1435 457,1498.0 277.0,1435"/><text class="label" x="457" y="1435" font-size="28px" font-weight="500" fill="#000"><tspan x="457" y="1418.5">Are all 10 windows</tspan><tspan x="457" y="1451.5">(600 seconds) complete?</tspan></text><rect class="box" x="140" y="1540" width="634" height="78" rx="8"/><text class="label" x="457.0" y="1579.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="1579.0">Stop capture and wait for queued window jobs</tspan></text><circle class="connector" cx="457" cy="1664" r="27"/><text class="connectorText" x="457" y="1664" font-size="28px" font-weight="700" fill="#000"><tspan x="457" y="1664.0">B</tspan></text><text class="label" x="457" y="1724" font-size="25px" font-weight="400" fill="#000"><tspan x="457" y="1724.0">A: continue the capture cycle</tspan></text><text class="label" x="457" y="1762" font-size="25px" font-weight="400" fill="#000"><tspan x="457" y="1762.0">B: continue to window analysis</tspan></text><circle class="connector" cx="850" cy="748" r="26"/><text class="connectorText" x="850" y="748" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="748.0">A</tspan></text><circle class="connector" cx="850" cy="1158" r="26"/><text class="connectorText" x="850" y="1158" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="1158.0">A</tspan></text><circle class="connector" cx="850" cy="1435" r="26"/><text class="connectorText" x="850" y="1435" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="1435.0">A</tspan></text><circle class="connector" cx="950" cy="190" r="26"/><text class="connectorText" x="950" y="190" font-size="28px" font-weight="700" fill="#000"><tspan x="950" y="190.0">B</tspan></text><rect class="box" x="1010" y="153" width="652" height="74" rx="8"/><text class="label" x="1336.0" y="190.0" font-size="28px" font-weight="500" fill="#000"><tspan x="1336.0" y="190.0">Select the next queued window, sensor, and axis</tspan></text><polygon class="diamond" points="1340,250.0 1520.0,315 1340,380.0 1160.0,315"/><text class="label" x="1340" y="315" font-size="26px" font-weight="500" fill="#000"><tspan x="1340" y="299.7">Do timing, coverage, and</tspan><tspan x="1340" y="330.3">signal-quality checks pass?</tspan></text><rect class="box" x="940" y="274" width="180" height="82" rx="8"/><text class="label" x="1030.0" y="315.0" font-size="23px" font-weight="500" fill="#000"><tspan x="1030.0" y="287.9">Mark peak</tspan><tspan x="1030.0" y="315.0">invalid; retain</tspan><tspan x="1030.0" y="342.1">QC status</tspan></text><rect class="box" x="1080" y="420" width="520" height="62" rx="8"/><text class="label" x="1340.0" y="451.0" font-size="28px" font-weight="500" fill="#000"><tspan x="1340.0" y="451.0">Remove the window mean</tspan></text><rect class="box" x="1080" y="505" width="520" height="62" rx="8"/><text class="label" x="1340.0" y="536.0" font-size="28px" font-weight="500" fill="#000"><tspan x="1340.0" y="536.0">Apply the symmetric Hann window</tspan></text><rect class="box" x="1080" y="590" width="520" height="62" rx="8"/><text class="label" x="1340.0" y="621.0" font-size="27px" font-weight="500" fill="#000"><tspan x="1340.0" y="621.0">Compute the N-point DFT using Bluestein</tspan></text><rect class="box" x="1080" y="675" width="520" height="62" rx="8"/><text class="label" x="1340.0" y="706.0" font-size="27px" font-weight="500" fill="#000"><tspan x="1340.0" y="706.0">Select the largest positive in-band bin</tspan></text><rect class="box" x="1080" y="760" width="520" height="62" rx="8"/><text class="label" x="1340.0" y="791.0" font-size="27px" font-weight="500" fill="#000"><tspan x="1340.0" y="791.0">Store the window result and QC flags</tspan></text><polygon class="diamond" points="1340,841.0 1520.0,900 1340,959.0 1160.0,900"/><text class="label" x="1340" y="900" font-size="28px" font-weight="500" fill="#000"><tspan x="1340" y="883.5">Are more queued</tspan><tspan x="1340" y="916.5">records available?</tspan></text><rect class="box" x="1160" y="1000" width="360" height="74" rx="8"/><text class="label" x="1340.0" y="1037.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1340.0" y="1022.2">Count valid peaks for each</tspan><tspan x="1340.0" y="1051.8">channel-axis</tspan></text><polygon class="diamond" points="1340,1108.0 1480.0,1170 1340,1232.0 1200.0,1170"/><text class="label" x="1340" y="1170" font-size="25px" font-weight="500" fill="#000"><tspan x="1340" y="1155.2">At least 10 valid peaks</tspan><tspan x="1340" y="1184.8">for this channel-axis?</tspan></text><rect class="box" x="930" y="1129" width="190" height="82" rx="8"/><text class="label" x="1025.0" y="1170.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1025.0" y="1155.2">Retain QC;</tspan><tspan x="1025.0" y="1184.8">no median</tspan></text><rect class="box" x="1570" y="1129" width="190" height="82" rx="8"/><text class="label" x="1665.0" y="1170.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1665.0" y="1155.2">Calculate</tspan><tspan x="1665.0" y="1184.8">the median</tspan></text><rect class="box" x="1080" y="1255" width="520" height="72" rx="8"/><text class="label" x="1340.0" y="1291.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1340.0" y="1276.2">Save raw records and windows CSV</tspan><tspan x="1340.0" y="1305.8">plus the session summary</tspan></text><rect class="box" x="1160" y="1360" width="360" height="70" rx="8"/><text class="label" x="1340.0" y="1395.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1340.0" y="1380.8">Await the concurrent</tspan><tspan x="1340.0" y="1409.2">vehicle tally</tspan></text><polygon class="diamond" points="1340,1456.0 1480.0,1515 1340,1574.0 1200.0,1515"/><text class="label" x="1340" y="1515" font-size="26px" font-weight="500" fill="#000"><tspan x="1340" y="1499.7">Are local count cutoffs</tspan><tspan x="1340" y="1530.3">frozen?</tspan></text><rect class="box" x="930" y="1474" width="190" height="82" rx="8"/><text class="label" x="1025.0" y="1515.0" font-size="23px" font-weight="500" fill="#000"><tspan x="1025.0" y="1501.4">Assign</tspan><tspan x="1025.0" y="1528.6">UNCLASSIFIED</tspan></text><rect class="box" x="1570" y="1474" width="190" height="82" rx="8"/><text class="label" x="1665.0" y="1515.0" font-size="23px" font-weight="500" fill="#000"><tspan x="1665.0" y="1501.4">Assign frozen</tspan><tspan x="1665.0" y="1528.6">local group</tspan></text><rect class="box" x="1080" y="1620" width="520" height="70" rx="8"/><text class="label" x="1340.0" y="1655.0" font-size="27px" font-weight="500" fill="#000"><tspan x="1340.0" y="1655.0">Save the finalized session summary</tspan></text><rect class="terminal" x="1200" y="1710" width="280" height="66" rx="33.0"/><text class="label" x="1340.0" y="1743.0" font-size="29px" font-weight="500" fill="#000"><tspan x="1340.0" y="1743.0">End</tspan></text><path class="arrow" stroke-width="4.5px" d="M457 230 V255"/><path class="arrow" stroke-width="4.5px" d="M457 355 V379"/><path class="arrow" stroke-width="4.5px" d="M277 445 H242"/><path class="arrow" stroke-width="4.5px" d="M457 511 V590"/><path class="arrow" stroke-width="4.5px" d="M147 486 V514"/><path class="arrow" stroke-width="4.5px" d="M457 666 V705"/><path class="arrow" stroke-width="4.5px" d="M455 793 V815"/><path class="arrow" stroke-width="4.5px" d="M455 893 V920"/><path class="arrow" stroke-width="4.5px" d="M277 985 H242"/><path class="arrow" stroke-width="4.5px" d="M147 1026 V1055"/><path class="arrow" stroke-width="4.5px" d="M457 1050 V1092"/><path class="arrow" stroke-width="4.5px" d="M457 1224 V1265"/><path class="arrow" stroke-width="4.5px" d="M457 1347 V1372"/><path class="arrow" stroke-width="4.5px" d="M457 1498 V1540"/><path class="arrow" stroke-width="4.5px" d="M457 1618 V1637"/><path class="arrow" stroke-width="4.5px" d="M824 748 H780"/><path class="arrow" stroke-width="4.5px" d="M637 1158 H824"/><path class="arrow" stroke-width="4.5px" d="M637 1435 H824"/><path class="arrow" stroke-width="4.5px" d="M976 190 H1010"/><path class="arrow" stroke-width="4.5px" d="M1340 227 V250"/><path class="arrow