<text x="900.0" y="32" font-size="34px" font-weight="700">FIELD DATA COLLECTION AND EVALUATION</text>
<rect class="panel" x="24" y="62" width="866" height="1480" rx="5"/><rect class="bar" x="24" y="62" width="866" height="72" rx="5"/><text class="barText" x="457.0" y="98.0" font-size="32px" font-weight="700" fill="#fff"><tspan x="457.0" y="98.0">PREPARE AND ACQUIRE</tspan></text><rect class="panel" x="910" y="62" width="866" height="1480" rx="5"/><rect class="bar" x="910" y="62" width="866" height="72" rx="5"/><text class="barText" x="1343.0" y="98.0" font-size="32px" font-weight="700" fill="#fff"><tspan x="1343.0" y="98.0">ACCEPT, CLASSIFY, AND ANALYZE</tspan></text><rect class="box" x="86" y="155" width="742" height="48" rx="6"/><text class="label" x="457.0" y="179.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="179.0">Obtain written site permission</tspan></text><rect class="box" x="86" y="213" width="742" height="48" rx="6"/><text class="label" x="457.0" y="237.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="237.0">Obtain ethics and privacy determination</tspan></text><rect class="box" x="86" y="271" width="742" height="48" rx="6"/><text class="label" x="457.0" y="295.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="295.0">Obtain site-safety clearance</tspan></text><rect class="box" x="86" y="329" width="742" height="48" rx="6"/><text class="label" x="457.0" y="353.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="353.0">Freeze the analysis settings</tspan></text><rect class="box" x="86" y="387" width="742" height="48" rx="6"/><text class="label" x="457.0" y="411.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="411.0">Freeze pilot traffic-count cutoffs</tspan></text><rect class="box" x="86" y="445" width="742" height="48" rx="6"/><text class="label" x="457.0" y="469.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="469.0">Bench-check the single PCB</tspan></text><rect class="box" x="86" y="503" width="742" height="48" rx="6"/><text class="label" x="457.0" y="527.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="527.0">Verify the approved station and orientation</tspan></text><rect class="box" x="86" y="561" width="742" height="48" rx="6"/><text class="label" x="457.0" y="585.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="585.0">Install the board at the fixed station</tspan></text><rect class="box" x="86" y="619" width="742" height="48" rx="6"/><text class="label" x="457.0" y="643.0" font-size="27px" font-weight="500" fill="#000"><tspan x="457.0" y="643.0">Run the stationary precheck</tspan></text><rect class="box" x="145" y="710" width="624" height="70" rx="8"/><text class="label" x="457.0" y="745.0" font-size="30px" font-weight="500" fill="#000"><tspan x="457.0" y="745.0">Start one fixed 600-second session</tspan></text><circle class="connector" cx="850" cy="745" r="26"/><text class="connectorText" x="850" y="745" font-size="28px" font-weight="700" fill="#000"><tspan x="850" y="745.0">A</tspan></text><rect class="box" x="90" y="860" width="350" height="82" rx="8"/><text class="label" x="265.0" y="901.0" font-size="29px" font-weight="500" fill="#000"><tspan x="265.0" y="883.9">Record sequential IMU</tspan><tspan x="265.0" y="918.1">samples</tspan></text><rect class="box" x="474" y="860" width="350" height="82" rx="8"/><text class="label" x="649.0" y="901.0" font-size="29px" font-weight="500" fill="#000"><tspan x="649.0" y="883.9">Tally vehicles</tspan><tspan x="649.0" y="918.1">concurrently</tspan></text><rect class="box" x="145" y="990" width="624" height="70" rx="8"/><text class="label" x="457.0" y="1025.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="1025.0">Stop both activities at 600 seconds</tspan></text><rect class="box" x="145" y="1090" width="624" height="70" rx="8"/><text class="label" x="457.0" y="1125.0" font-size="29px" font-weight="500" fill="#000"><tspan x="457.0" y="1125.0">Save raw records and session metadata</tspan></text><circle class="connector" cx="457" cy="1225" r="27"/><text class="connectorText" x="457" y="1225" font-size="28px" font-weight="700" fill="#000"><tspan x="457" y="1225.0">B</tspan></text><text class="label" x="457" y="1310" font-size="27px" font-weight="400" fill="#000"><tspan x="457" y="1310.0">A: repeat the fixed session</tspan></text><text class="label" x="457" y="1356" font-size="27px" font-weight="400" fill="#000"><tspan x="457" y="1356.0">B: continue to session checks</tspan></text><circle class="connector" cx="950" cy="190" r="26"/><text class="connectorText" x="950" y="190" font-size="28px" font-weight="700" fill="#000"><tspan x="950" y="190.0">B</tspan></text><rect class="box" x="1010" y="154" width="650" height="72" rx="8"/><text class="label" x="1335.0" y="190.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1335.0" y="175.2">Check predeclared timing, coverage,</tspan><tspan x="1335.0" y="204.8">sensor, and signal criteria</tspan></text><polygon class="diamond" points="1340,252.0 1520.0,315 1340,378.0 1160.0,315"/><text class="label" x="1340" y="315" font-size="28px" font-weight="500" fill="#000"><tspan x="1340" y="298.5">Does the session meet</tspan><tspan x="1340" y="331.5">technical criteria?</tspan></text><rect class="box" x="940" y="272" width="180" height="74" rx="8"/><text class="label" x="1030.0" y="309.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1030.0" y="294.8">Log exclusion</tspan><tspan x="1030.0" y="323.2">reason</tspan></text><rect class="box" x="940" y="375" width="180" height="78" rx="8"/><text class="label" x="1030.0" y="414.0" font-size="21px" font-weight="500" fill="#000"><tspan x="1030.0" y="389.2">Exclude from</tspan><tspan x="1030.0" y="414.0">valid-session</tspan><tspan x="1030.0" y="438.8">set</tspan></text><circle class="connector" cx="950" cy="500" r="26"/><text class="connectorText" x="950" y="500" font-size="28px" font-weight="700" fill="#000"><tspan x="950" y="500.0">A</tspan></text><rect class="box" x="1160" y="398" width="360" height="80" rx="8"/><text class="label" x="1340.0" y="438.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1340.0" y="423.8">Calculate rate:</tspan><tspan x="1340.0" y="452.2">r = C/10 vehicles/min</tspan></text><polygon class="diamond" points="1340,510.0 1490.0,570 1340,630.0 1190.0,570"/><text class="label" x="1340" y="570" font-size="26px" font-weight="500" fill="#000"><tspan x="1340" y="554.7">Are local count cutoffs</tspan><tspan x="1340" y="585.3">frozen?</tspan></text><rect class="box" x="900" y="530" width="220" height="80" rx="8"/><text class="label" x="1010.0" y="570.0" font-size="24px" font-weight="500" fill="#000"><tspan x="1010.0" y="555.8">Assign</tspan><tspan x="1010.0" y="584.2">UNCLASSIFIED</tspan></text><rect class="box" x="1560" y="530" width="210" height="80" rx="8"/><text class="label" x="1665.0" y="570.0" font-size="23px" font-weight="500" fill="#000"><tspan x="1665.0" y="556.4">Assign the</tspan><tspan x="1665.0" y="583.6">pilot-defined group</tspan></text><rect class="box" x="1160" y="650" width="360" height="76" rx="8"/><text class="label" x="1340.0" y="688.0" font-size="25px" font-weight="500" fill="#000"><tspan x="1340.0" y="673.2">Create ten consecutive</tspan><tspan x="1340.0" y="702.8">60-second windows</tspan></text><rect class="box" x="1160" y="755" width="360" height="90" rx="8"/><text class="label" x="1340.0" y="800.0" font-size="22px" font-weight="500" fill="#000"><tspan x="1340.0" y="774.0">Process each</tspan><tspan x="1340.0" y="800.0">channel-axis window</tspan><tspan x="1340.0" y="826.0">using Figure 3.4</tspan></text><rect class="box" x="1160" y="855" width="360" height="70" rx="8"/><text class="label" x="1340.0" y="890.0" font-size="26px" font-weight="500" fill="#000"><tspan x="1340.0" y="874.7">Summarize valid estimates by</tspan><tspan x="1340.0" y="905.3">channel and axis</tspan></text><rect class="box" x="1160" y="949" width="360" height="70" rx="8"/><text class="label" x="